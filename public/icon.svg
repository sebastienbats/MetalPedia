<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>
  
  <!-- Dégradé de fond subtil -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8b0000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fireGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d63031"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>
  
  <!-- Éclair / Riff stylisé -->
  <path d="M280 80 L200 250 L260 250 L220 432 L360 220 L290 220 L340 80 Z" 
        fill="url(#fireGradient)" 
        stroke="#d63031" 
        stroke-width="8" 
        stroke-linejoin="round"/>
  
  <!-- Cercles décoratifs (cornes du diable stylisées) -->
  <circle cx="140" cy="140" r="20" fill="#d63031" opacity="0.6"/>
  <circle cx="372" cy="380" r="14" fill="#d63031" opacity="0.4"/>
  
  <!-- Texte "MP" stylisé en bas -->
  <text x="256" y="480" 
        font-family="Arial Black, sans-serif" 
        font-size="48" 
        font-weight="900" 
        fill="#d63031" 
        text-anchor="middle"
        letter-spacing="8">MP</text>
</svg>
