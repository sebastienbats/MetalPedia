<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetalPedia - Hors ligne</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #f3f4f6;
      font-family: system-ui;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container { max-width: 400px; padding: 2rem; }
    .icon { font-size: 5rem; margin-bottom: 1rem; }
    h1 { color: #d63031; margin: 0 0 1rem; }
    p { color: #9ca3af; }
    button {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background: linear-gradient(to right, #8b0000, #d63031);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      Pas de panique ! Vos favoris et données locales sont toujours accessibles.
      La synchronisation reprendra automatiquement au retour de la connexion.
    </p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
