name: MetalPedia CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'

jobs:
  # ═══════════════════════════════════════════
  # LINT & TYPE CHECK
  # ═══════════════════════════════════════════
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  # ═══════════════════════════════════════════
  # BUILD FRONTEND
  # ═══════════════════════════════════════════
  build-frontend:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate PWA icons
        run: npm run icons

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 7

  # ═══════════════════════════════════════════
  # BUILD ML SERVICE
  # ═══════════════════════════════════════════
  build-ml-service:
    name: 🐍 Build ML Service
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd ml-service
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          cd ml-service
          python -m py_compile app/main.py app/spotify_client.py app/embeddings.py app/recommendations.py

  # ═══════════════════════════════════════════
  # DOCKER BUILD & PUSH
  # ═══════════════════════════════════════════

  # ═══════════════════════════════════════════
  # DÉPLOIEMENT VERCEL (Optionnel)
  # ═══════════════════════════════════════════
